name: Update player form data

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch-form:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch player form via Sofascore (botasaurus)
        run: python scripts/fetch_form.py

      - name: Commit updated data files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update player form data [skip ci]'
          file_pattern: 'player-form.json scripts/team_ids.json scripts/lineups_cache.json'
